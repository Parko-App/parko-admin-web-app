<app-modal [open]="open()" title="Registrar pago" (closed)="closed.emit()">
  <form id="payment-form" [formGroup]="form" (submit)="$event.preventDefault(); submit()" novalidate>
    @if (error(); as message) {
      <div class="form-error" role="alert">{{ message }}</div>
    }

    <p class="intro">Pago en efectivo de un ticket de visitante.</p>

    <div class="field">
      <label for="pay-ticket">Nro. de ticket</label>
      <input id="pay-ticket" formControlName="ticketNumber" placeholder="TKT-…" autocomplete="off" spellcheck="false"
             class="mono" [attr.aria-invalid]="showError('ticketNumber')"
             [attr.aria-describedby]="showError('ticketNumber') ? 'pay-ticket-error' : null" />
      @if (showError('ticketNumber')) {
        <p class="field__error" id="pay-ticket-error">Ingresá el número de ticket.</p>
      }
    </div>

    <div class="field">
      <label for="pay-amount">Monto a pagar ($)</label>
      <input id="pay-amount" type="number" inputmode="decimal" min="0" step="0.01" formControlName="amount"
             placeholder="0" [attr.aria-invalid]="showError('amount')"
             [attr.aria-describedby]="showError('amount') ? 'pay-amount-error' : null" />
      @if (showError('amount')) {
        <p class="field__error" id="pay-amount-error">Ingresá un monto mayor a cero.</p>
      }
    </div>

    <div class="field">
      <label for="pay-notes">Observaciones <span class="optional">(opcional)</span></label>
      <textarea id="pay-notes" formControlName="notes" rows="2" [attr.maxlength]="notesMaxLength"></textarea>
    </div>
  </form>

  <ng-container modalFooter>
    <button type="button" class="btn" (click)="closed.emit()">Cancelar</button>
    <button type="submit" form="payment-form" class="btn btn--primary" [disabled]="saving()">
      {{ saving() ? 'Registrando…' : 'Registrar pago' }}
    </button>
  </ng-container>
</app-modal>
