<figure class="chart">
  <svg
    [attr.viewBox]="'0 0 ' + width + ' ' + height"
    role="img"
    [attr.aria-label]="ariaLabel()"
    (pointermove)="onMove($event)"
    (pointerleave)="hovered.set(null)"
  >
    @for (tick of yTicks(); track $index) {
      <line class="chart__grid" [attr.x1]="plotLeft" [attr.x2]="plotRight" [attr.y1]="tick.y" [attr.y2]="tick.y" />
      <text class="chart__axis" [attr.x]="plotLeft - 8" [attr.y]="tick.y + 3" text-anchor="end">{{ tick.value }}</text>
    }
    @for (item of xLabels(); track item.label) {
      <text class="chart__axis" [attr.x]="item.x" [attr.y]="labelY" text-anchor="middle">{{ item.label }}</text>
    }

    @for (line of lines(); track line.name) {
      <path class="chart__line" [attr.d]="line.path" [attr.stroke]="line.color" fill="none" />
      @for (point of line.points; track $index) {
        <circle class="chart__dot" [attr.cx]="point.x" [attr.cy]="point.y" r="3" [attr.stroke]="line.color" />
      }
    }

    @if (tooltip(); as tip) {
      <line class="chart__cursor" [attr.x1]="tip.cursorX" [attr.x2]="tip.cursorX" [attr.y1]="12" [attr.y2]="plotBottom" />
      <g class="chart__tip" aria-hidden="true">
        <rect [attr.x]="tip.x" [attr.y]="tip.y" [attr.width]="tip.width" [attr.height]="tip.height" rx="4" />
        @for (line of tip.lines; track $index) {
          <text [attr.x]="tip.x + 10" [attr.y]="tip.y + 17 + $index * 15" [class.chart__tip-title]="$index === 0">{{ line }}</text>
        }
      </g>
    }
  </svg>

  <ul class="legend">
    @for (item of series(); track item.name) {
      <li><span class="legend__swatch" [style.background]="item.color"></span>{{ item.name }}</li>
    }
  </ul>

  <table class="sr-only">
    <caption>{{ ariaLabel() }}</caption>
    <thead>
      <tr>
        <th scope="col">Fecha</th>
        @for (item of series(); track item.name) { <th scope="col">{{ item.name }}</th> }
      </tr>
    </thead>
    <tbody>
      @for (label of labels(); track $index) {
        <tr>
          <th scope="row">{{ label }}</th>
          @for (item of series(); track item.name) { <td>{{ item.values[$index] }}</td> }
        </tr>
      }
    </tbody>
  </table>
</figure>
