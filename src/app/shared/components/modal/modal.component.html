@if (open()) {
  <div class="backdrop" (click)="onBackdrop($event)" (keydown)="onKeydown($event)" role="presentation">
    <div
      #dialog
      class="dialog"
      [class]="'dialog--' + size()"
      role="dialog"
      aria-modal="true"
      [attr.aria-labelledby]="titleId"
      tabindex="-1"
    >
      <header class="dialog__header">
        <h2 [id]="titleId">{{ title() }}</h2>
        <button type="button" class="dialog__close" aria-label="Cerrar" (click)="closed.emit()">×</button>
      </header>
      <div class="dialog__body"><ng-content /></div>
      <footer class="dialog__footer"><ng-content select="[modalFooter]" /></footer>
    </div>
  </div>
}
